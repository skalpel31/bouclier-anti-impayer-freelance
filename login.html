<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouclier — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --night:#080c10;--deep:#0d1117;--surface:#131920;--raised:#1c2530;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#e8edf2;--muted:#6b7a8d;--subtle:#8f9fb3;
  --emerald:#10b981;--emerald2:#059669;--red:#f87171;
}
body{font-family:'Geist',system-ui,sans-serif;background:var(--night);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;overflow:hidden;}
body::before{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(16,185,129,0.07),transparent 70%);pointer-events:none;}
.card{background:var(--deep);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:400px;padding:2.5rem;box-shadow:0 40px 80px rgba(0,0,0,.6);position:relative;z-index:1;}
.brand{display:flex;align-items:center;gap:.65rem;margin-bottom:2rem;}
.brand-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#10b981,#047857);display:flex;align-items:center;justify-content:center;font-size:1rem;}
.brand-name{font-family:'Instrument Serif',serif;font-size:1.3rem;color:var(--text);}
.tabs{display:flex;background:var(--surface);border-radius:8px;padding:3px;margin-bottom:1.75rem;}
.tab{flex:1;padding:.5rem;text-align:center;font-size:.78rem;border-radius:6px;cursor:pointer;transition:all .2s;color:var(--muted);border:none;background:none;font-family:inherit;}
.tab.active{background:var(--raised);color:var(--text);font-weight:500;}
.form-group{margin-bottom:1rem;}
.form-label{font-size:.63rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:.4rem;}
.form-input{width:100%;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;color:var(--text);font-family:inherit;font-size:.85rem;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--emerald);}
.form-input::placeholder{color:var(--muted);}
.btn-main{width:100%;background:var(--emerald);color:#fff;border:none;font-family:inherit;font-size:.9rem;font-weight:500;padding:.8rem;border-radius:8px;cursor:pointer;transition:background .2s;margin-top:.5rem;}
.btn-main:hover{background:var(--emerald2);}
.error-box{display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);border-radius:6px;padding:.65rem .9rem;font-size:.73rem;color:var(--red);margin-bottom:.85rem;}
.success-box{display:none;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);border-radius:6px;padding:.65rem .9rem;font-size:.73rem;color:var(--emerald);margin-bottom:.85rem;}
.loading{display:none;text-align:center;padding:2rem 0;}
.spinner{width:40px;height:40px;border:2px solid rgba(16,185,129,.2);border-top-color:var(--emerald);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.82rem;color:var(--subtle);}
.back-link{display:block;text-align:center;margin-top:1.25rem;font-size:.73rem;color:var(--muted);text-decoration:none;}
.back-link:hover{color:var(--text);}
.admin-link{display:block;text-align:center;margin-top:.75rem;font-size:.68rem;color:rgba(167,139,250,.4);cursor:pointer;}
.admin-link:hover{color:#a78bfa;}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" style="text-decoration:none;" class="brand">
    <div class="brand-icon">🛡</div>
    <span class="brand-name">Bouclier</span>
  </a>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchMode('login')">Se connecter</button>
    <button class="tab" id="tab-signup" onclick="switchMode('signup')">Créer un compte</button>
  </div>

  <div id="form-area">
    <div class="error-box" id="error-box"></div>
    <div class="success-box" id="success-box"></div>
    <div class="form-group" id="group-name" style="display:none">
      <label class="form-label">Prénom & Nom</label>
      <input class="form-input" id="input-name" type="text" placeholder="Sophie Martin">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="input-email" type="email" placeholder="vous@email.fr">
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe</label>
      <div style="position:relative;">
        <input class="form-input" id="input-pwd" type="password" placeholder="••••••••••" style="padding-right:2.75rem;">
        <button type="button" onclick="togglePwd('input-pwd','eye1')" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:0;display:flex;align-items:center;">
          <svg id="eye1" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="form-group" id="group-confirm" style="display:none">
      <label class="form-label">Confirmer le mot de passe</label>
      <div style="position:relative;">
        <input class="form-input" id="input-confirm" type="password" placeholder="••••••••••" style="padding-right:2.75rem;">
        <button type="button" onclick="togglePwd('input-confirm','eye2')" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:0;display:flex;align-items:center;">
          <svg id="eye2" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="form-group" id="group-mode" style="display:none">
      <label class="form-label">Vous facturez plutôt</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;">
        <div id="mode-b2b" onclick="selectMode('b2b')" style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.4);border-radius:var(--r2);padding:.75rem .5rem;cursor:pointer;text-align:center;transition:all .2s;">
          <div style="font-size:1rem;margin-bottom:.25rem;">🏢</div>
          <div style="font-size:.7rem;font-weight:600;color:var(--text);">Entreprises</div>
          <div style="font-size:.58rem;color:var(--muted);margin-top:.15rem;">B2B</div>
        </div>
        <div id="mode-b2c" onclick="selectMode('b2c')" style="background:var(--raised);border:1px solid var(--border);border-radius:var(--r2);padding:.75rem .5rem;cursor:pointer;text-align:center;transition:all .2s;">
          <div style="font-size:1rem;margin-bottom:.25rem;">👤</div>
          <div style="font-size:.7rem;font-weight:600;color:var(--text);">Particuliers</div>
          <div style="font-size:.58rem;color:var(--muted);margin-top:.15rem;">B2C</div>
        </div>
        <div id="mode-both" onclick="selectMode('both')" style="background:var(--raised);border:1px solid var(--border);border-radius:var(--r2);padding:.75rem .5rem;cursor:pointer;text-align:center;transition:all .2s;">
          <div style="font-size:1rem;margin-bottom:.25rem;">🔀</div>
          <div style="font-size:.7rem;font-weight:600;color:var(--text);">Les deux</div>
          <div style="font-size:.58rem;color:var(--muted);margin-top:.15rem;">B2B + B2C</div>
        </div>
      </div>
      <input type="hidden" id="selected-mode" value="b2b">
    </div>
    <button class="btn-main" id="btn-submit" onclick="handleSubmit()">Se connecter</button>
  </div>

  <div class="loading" id="loading-area">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-msg">Connexion en cours…</div>
  </div>

  <a href="index.html" class="back-link">← Retour à l'accueil</a>
  
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPA_URL = 'https://ckeesujhlywzuutweasg.supabase.co';
var SUPA_KEY = 'sb_publishable__kxmv2eduIlLT-fSnGd_Rg_6r45QsGk';
var ADMIN_EMAIL = 'alex.skp31@gmail.com';
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);
var mode = 'login';

// Si déjà connecté redirect direct
sb.auth.getSession().then(function(result) {
  if (result.data && result.data.session) {
    window.location.href = 'dashboard.html';
  }
});

function togglePwd(inputId, eyeId) {
  var input = document.getElementById(inputId);
  var eye   = document.getElementById(eyeId);
  if (input.type === 'password') {
    input.type = 'text';
    eye.style.color = 'var(--emerald)';
  } else {
    input.type = 'password';
    eye.style.color = 'var(--muted)';
  }
}

function switchMode(m) {
  mode = m;
  document.getElementById('tab-login').classList.toggle('active', m === 'login');
  document.getElementById('tab-signup').classList.toggle('active', m === 'signup');
  document.getElementById('group-name').style.display    = m === 'signup' ? 'block' : 'none';
  document.getElementById('group-mode').style.display     = m === 'signup' ? 'block' : 'none';
  document.getElementById('group-confirm').style.display = m === 'signup' ? 'block' : 'none';
  document.getElementById('btn-submit').textContent = m === 'login' ? 'Se connecter' : 'Créer mon compte';
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('success-box').style.display = 'none';
}

function showError(msg) {
  var el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
}

function showSuccess(msg) {
  var el = document.getElementById('success-box');
  el.textContent = msg;
  el.style.display = 'block';
}

function setLoading(on, msg) {
  document.getElementById('form-area').style.display = on ? 'none' : 'block';
  document.getElementById('loading-area').style.display = on ? 'block' : 'none';
  if (msg) document.getElementById('loading-msg').textContent = msg;
}

function handleSubmit() {
  var email = document.getElementById('input-email').value.trim();
  var pwd   = document.getElementById('input-pwd').value;
  var name  = document.getElementById('input-name').value.trim();

  document.getElementById('error-box').style.display = 'none';
  document.getElementById('success-box').style.display = 'none';

  if (!email || !pwd) { showError('Veuillez remplir tous les champs.'); return; }
  if (mode === 'signup' && !name) { showError('Veuillez entrer votre nom.'); return; }

  if (mode === 'login') {
    setLoading(true, 'Connexion en cours…');
    sb.auth.signInWithPassword({ email: email, password: pwd }).then(function(result) {
      if (result.error) {
        setLoading(false);
        showError('Email ou mot de passe incorrect.');
        return;
      }
      setLoading(true, 'Chargement de votre espace…');
      setTimeout(function() { window.location.href = 'dashboard.html'; }, 800);
    });
  } else {
    var confirm = document.getElementById('input-confirm').value;
    if (pwd !== confirm) { showError('Les mots de passe ne correspondent pas.'); return; }
    if (pwd.length < 6) { showError('Le mot de passe doit contenir au moins 6 caractères.'); return; }
    setLoading(true, 'Création de votre compte…');
    sb.auth.signUp({
      email: email,
      password: pwd,
      options: { data: { full_name: name, mode: document.getElementById('selected-mode').value } }
    }).then(function(result) {
      if (result.error) {
        setLoading(false);
        var msg = result.error.message;
        if (msg.indexOf('already') !== -1) msg = 'Cet email est déjà utilisé. Connectez-vous.';
        showError(msg);
        return;
      }
      setLoading(false);
      showSuccess('Compte créé avec succès ! Connectez-vous maintenant.');
      switchMode('login');
    });
  }
}

function adminLogin() {
  var email = prompt('Email admin :');
  if (!email) return;
  var pwd = prompt('Mot de passe :');
  if (!pwd) return;
  sb.auth.signInWithPassword({ email: email, password: pwd }).then(function(result) {
    if (result.error) { alert('Accès refusé.'); return; }
    if (result.data.user.email === ADMIN_EMAIL) {
      window.location.href = 'admin.html';
    } else {
      alert('Vous n\'avez pas les droits administrateur.');
      sb.auth.signOut();
    }
  });
}

var selectedMode = 'b2b';
function selectMode(m) {
  selectedMode = m;
  document.getElementById('selected-mode').value = m;
  var cards = { b2b: document.getElementById('mode-b2b'), b2c: document.getElementById('mode-b2c'), both: document.getElementById('mode-both') };
  var colors = { b2b: 'rgba(16,185,129,.4)', b2c: 'rgba(96,165,250,.4)', both: 'rgba(167,139,250,.4)' };
  var bgs = { b2b: 'rgba(16,185,129,.06)', b2c: 'rgba(96,165,250,.06)', both: 'rgba(167,139,250,.06)' };
  Object.keys(cards).forEach(function(key) {
    if (key === m) {
      cards[key].style.borderColor = colors[key];
      cards[key].style.background = bgs[key];
    } else {
      cards[key].style.borderColor = 'var(--border)';
      cards[key].style.background = 'var(--raised)';
    }
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleSubmit();
});
</script>
</body>
</html>
